behaviors:
  DeliveryFlight:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 0.0003
      beta: 0.003
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 500000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 100000
    keep_checkpoints: 3
engine_settings:
  time_scale: 30
  no_graphics: true
  target_frame_rate: -1
  capture_frame_rate: 0
torch_settings:
  device: cpu
